name: macOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install uv python whisper-cpp ggml libomp
      - name: Build application and DMG
        run: bash Support/build-macos.sh
      - name: Test speech segmentation and worker protocol
        run: |
          swift test -c release --disable-xctest --filter SegmentationTests -j 3
          .venv/bin/python -m unittest discover -s Tests -p 'test_mlx_protocol.py'
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: STTS-0.1.0-macos-arm64
          path: dist/STTS-0.1.0-arm64.dmg
          compression-level: 0
          retention-days: 7
